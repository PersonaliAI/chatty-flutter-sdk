name: chatty_flutter
description: "Official Flutter SDK for Chatty AI chatbots — chat widget, floating launcher, theming, markdown/LaTeX rendering."
version: 0.0.2
homepage: https://github.com/PersonaliAI/chatty-flutter-sdk

environment:
  sdk: ^3.13.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for the /api/widget/* endpoints.
  http: ^1.6.0
  # Only for MediaType on multipart file uploads — a real (not hand-rolled)
  # content-type value object, already a transitive dep of http but imported
  # directly here so pub's dependency resolution stays explicit.
  http_parser: ^4.1.2
  # Persists the per-bot/per-host session id across app restarts — same
  # purpose as chatty-android-sdk's SharedPreferences-backed ChattySession.
  shared_preferences: ^2.5.5
  # Permission *status* checks only (never .request() — see the SDK's
  # permission-gating contract in chatty_chat_screen.dart: this SDK reflects
  # whatever the host app has already granted, it never prompts itself).
  permission_handler: ^13.0.1
  # Real CommonMark + GFM (tables, strikethrough) parsing for chat replies —
  # matches web's remark-gfm feature set. See chatty_markdown.dart.
  markdown: ^7.3.1
  # LaTeX equation rendering ($...$ / $$...$$), aiming for KaTeX fidelity —
  # matches web's remark-math + rehype-katex. Pure Dart/Flutter, no WebView.
  flutter_math_fork: ^0.7.4
  # Full-Unicode emoji picker (search, categories, recently used) — same
  # role as chatty-android-sdk's androidx.emoji2 EmojiPickerView.
  emoji_picker_flutter: ^4.5.4
  # Camera / photo library picker for the attach menu.
  image_picker: ^1.2.3
  # Document picker for the attach menu.
  file_picker: ^12.2.0
  # One-shot location fix for the attach menu's "Location" option.
  geolocator: ^14.0.3
  # Opens links tapped inside chat replies.
  url_launcher: ^6.3.2
  # Composer mic button — voice-note recording for server-side transcription.
  record: ^7.1.1
  # ChattyEmbedScreen: loads the actual web widget page for guaranteed
  # feature parity, instead of a hand-maintained native reimplementation.
  webview_flutter: ^4.14.1
  # Android-specific WebViewController APIs (setOnPlatformPermissionRequest,
  # setGeolocationPermissionsPromptCallbacks) — mic/location for the embedded
  # page's getUserMedia()/geolocation calls, reflect-only same as the other
  # SDKs' native WebView integrations.
  webview_flutter_android: ^4.14.1
  # ChattyEmbedScreen's offline detection/retry screen.
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

